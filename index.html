<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Controle de Ponto de Diarista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12161d; --panel:#1b212b; --panel-2:#222836; --line:#2c3340;
    --text:#edeff2; --text-dim:#8b93a1;
    --teal:#3fa796; --teal-dim:#234b45;
    --amber:#f2a93b; --amber-dim:#4d3a17;
    --green:#6fcf97; --green-dim:#1f3a2b;
    --red:#e85d5d; --red-dim:#452323;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  h1,h2,h3,.display{font-family:'Oswald',sans-serif;letter-spacing:.03em;text-transform:uppercase;}
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}

  .shell{max-width:1000px;margin:0 auto;padding:24px 20px 60px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(155deg,var(--amber),#c97e1f);display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:700;color:#1b1206;font-size:18px;}
  .brand h1{font-size:19px;margin:0;color:var(--text);}
  .brand span{display:block;font-size:11px;color:var(--text-dim);text-transform:none;letter-spacing:normal;font-family:'Inter',sans-serif;}

  .tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;flex-wrap:wrap;}
  .tab-btn{background:transparent;border:none;color:var(--text-dim);padding:9px 14px;border-radius:8px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-family:'Oswald',sans-serif;}
  .tab-btn.active{background:var(--panel-2);color:var(--amber);}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px;}
  .card h2{font-size:15px;color:var(--text-dim);margin:0 0 16px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:140px;}
  .field label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;}
  .field input, .field textarea{background:var(--bg);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;outline:none;width:100%;}
  .field textarea{font-family:'JetBrains Mono',monospace;font-size:13px;resize:vertical;min-height:130px;line-height:1.5;}
  .field input:focus, .field textarea:focus{border-color:var(--amber);}
  .btn{border:none;border-radius:8px;padding:11px 18px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-family:'Oswald',sans-serif;}
  .btn-primary{background:var(--amber);color:#1b1206;}
  .btn-primary:hover{background:#f7bb5c;}
  .btn-ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--amber);}
  .btn-danger{background:var(--red-dim);color:#ffb3b3;border:1px solid var(--red);}
  .btn-sm{padding:6px 10px;font-size:11px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--text-dim);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:10px 10px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .pill-wait{background:var(--panel-2);color:var(--text-dim);}
  .pill-open{background:var(--teal-dim);color:var(--teal);}
  .pill-done{background:var(--green-dim);color:var(--green);}
  .empty{color:var(--text-dim);font-size:13px;padding:20px 0;text-align:center;}

  .qr-section{border-radius:14px;padding:18px;margin-bottom:16px;}
  .qr-section.entrada{border:1px solid var(--teal);background:linear-gradient(180deg,var(--teal-dim),transparent 40%);}
  .qr-section.saida{border:1px solid var(--amber);background:linear-gradient(180deg,var(--amber-dim),transparent 40%);}
  .qr-section h3{margin:0 0 4px;font-size:16px;}
  .qr-section.entrada h3{color:var(--teal);}
  .qr-section.saida h3{color:var(--amber);}
  .qr-section .qr-sub{font-size:12px;color:var(--text-dim);margin-bottom:14px;}
  .qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;}
  .qr-card{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;}
  .qr-card .qr-box{background:#fff;padding:8px;border-radius:8px;display:inline-block;margin-bottom:8px;}
  .qr-card .qr-box svg{display:block;width:120px;height:120px;}
  .qr-card .nome{font-weight:600;font-size:13px;}
  .qr-card .mat{color:var(--text-dim);font-size:11px;margin-bottom:2px;font-family:'JetBrains Mono',monospace;}
  .qr-card .tag{display:inline-block;margin-top:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:10px;}
  .qr-card.entrada .tag{background:var(--teal-dim);color:var(--teal);}
  .qr-card.saida .tag{background:var(--amber-dim);color:var(--amber);}

  .helper{font-size:12px;color:var(--text-dim);line-height:1.5;margin-top:8px;}
  .badge-count{background:var(--panel-2);color:var(--text-dim);border-radius:20px;padding:2px 9px;font-size:11px;margin-left:6px;}

  .mode-banner{border-radius:14px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .mode-banner.entrada{background:linear-gradient(135deg,var(--teal-dim),var(--panel));border:1px solid var(--teal);}
  .mode-banner.saida{background:linear-gradient(135deg,var(--amber-dim),var(--panel));border:1px solid var(--amber);}
  .mode-banner .m-title{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:22px;font-weight:700;letter-spacing:.04em;}
  .mode-banner.entrada .m-title{color:var(--teal);}
  .mode-banner.saida .m-title{color:var(--amber);}
  .mode-banner .m-sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .mode-banner .m-count{font-family:'JetBrains Mono',monospace;font-size:20px;color:var(--text);}
  .mode-banner .m-count span{font-size:12px;color:var(--text-dim);display:block;font-family:'Inter',sans-serif;}

  .result-banner{width:100%;max-width:420px;border-radius:14px;padding:16px 20px;text-align:center;margin:16px auto;}
  .result-banner.idle{background:var(--panel-2);border:1px solid var(--line);}
  .result-banner.entrada{background:var(--teal-dim);border:1px solid var(--teal);}
  .result-banner.saida{background:var(--amber-dim);border:1px solid var(--amber);}
  .result-banner.erro{background:var(--red-dim);border:1px solid var(--red);}
  .result-banner .r-title{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:18px;font-weight:700;}
  .result-banner .r-sub{font-size:13px;color:var(--text-dim);margin-top:4px;}
  .result-banner.entrada .r-title{color:var(--teal);}
  .result-banner.saida .r-title{color:var(--amber);}
  .result-banner.erro .r-title{color:#ff9d9d;}

  .clock-mini{font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--text-dim);text-align:center;display:block;margin-bottom:4px;}

  .check-list{display:flex;flex-direction:column;gap:8px;}
  .check-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .check-row .c-info .c-nome{font-weight:600;font-size:14px;}
  .check-row .c-info .c-mat{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}
  .check-row button{border:none;border-radius:8px;padding:9px 14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-family:'Oswald',sans-serif;white-space:nowrap;}
  .check-row.pendente.mode-entrada button{background:var(--teal);color:#08211d;}
  .check-row.pendente.mode-saida button{background:var(--amber);color:#241a05;}
  .check-row.concluido{opacity:.7;}
  .check-row.concluido .c-status{font-size:12px;color:var(--green);font-weight:600;font-family:'JetBrains Mono',monospace;}
  .check-row.bloqueado{opacity:.55;}
  .check-row.bloqueado .c-status{font-size:11px;color:var(--text-dim);font-style:italic;}
  .filter-input{margin-bottom:12px;}
  .spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .present-box{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .present-progress{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;}
  .present-qr{background:#fff;padding:16px;border-radius:16px;}
  .present-qr svg{display:block;width:220px;height:220px;}
  .present-nome{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:22px;text-align:center;}
  .present-mat{color:var(--text-dim);font-size:13px;font-family:'JetBrains Mono',monospace;}
  .present-nav{display:flex;gap:10px;width:100%;max-width:420px;}
  .present-nav .btn{flex:1;}
  .present-confirm{width:100%;max-width:420px;padding:16px;font-size:15px;}
  .present-confirm.entrada{background:var(--teal);color:#08211d;}
  .present-confirm.saida{background:var(--amber);color:#241a05;}
  .present-done-msg{text-align:center;color:var(--green);font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:18px;padding:30px 0;}

  @media print{
    body{background:#fff;color:#000;}
    .no-print{display:none !important;}
    .qr-section{border:1px solid #ccc !important;background:#fff !important;}
    .qr-section h3, .qr-section .qr-sub{color:#000 !important;}
    .qr-card{background:#fff;border:1px solid #ccc;}
    .qr-card .nome,.qr-card .mat{color:#000;}
    .print-only-entrada .qr-section.saida{display:none;}
    .print-only-saida .qr-section.entrada{display:none;}
  }

  @media (max-width: 640px){
    .shell{padding:14px 10px 40px;}
    .topbar{gap:10px;}
    .brand{gap:8px;}
    .brand-mark{width:34px;height:34px;font-size:15px;border-radius:8px;}
    .brand h1{font-size:15px;}
    .brand h1 span{font-size:10px;}
    .tabs{gap:4px;padding:4px;width:100%;}
    .tab-btn{padding:8px 8px;font-size:11px;flex:1;min-width:0;}
    .card{padding:14px;border-radius:12px;}
    .card h2{font-size:13px;}
    .row{gap:8px;}
    .field{min-width:0;flex:1 1 100%;}
    .field input, .field textarea{font-size:16px;} /* evita zoom automático no iOS ao focar campo */
    .mode-banner{padding:12px 14px;}
    .mode-banner .m-title{font-size:17px;}
    .mode-banner .m-count{font-size:16px;}
    .qr-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;}
    .qr-card{padding:10px;}
    .qr-card .qr-box svg{width:90px;height:90px;}
    .present-qr{padding:10px;border-radius:12px;}
    .present-qr svg{width:170px;height:170px;}
    .present-nome{font-size:18px;}
    .present-nav{max-width:100%;}
    .check-row{flex-wrap:wrap;padding:10px 12px;}
    .check-row button{width:100%;}
    table{font-size:12px;}
    th,td{padding:8px 6px;}
    .card:has(table){overflow-x:auto;}
    table{min-width:420px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .25s ease;pointer-events:none;z-index:50;"></div>

<script>
/* qrcode-generator (MIT) */
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';

          if (table.size() < 0xfff) {

<script>
const $ = (sel, el=document) => el.querySelector(sel);
const app = $('#app');

// ---------- shared cross-device storage (Google Sheets via Apps Script) ----------
let APPS_SCRIPT_URL = '';
try{ APPS_SCRIPT_URL = localStorage.getItem('ponto_apps_script_url') || ''; }catch(e){}

let lastFetchErrorToast = 0;
function notifyFetchError(){
  const now = Date.now();
  if(now - lastFetchErrorToast < 6000) return; // evita várias mensagens ao mesmo tempo (ex: carregando vários colaboradores em paralelo)
  lastFetchErrorToast = now;
  toast('Sem conexão com a planilha. Veja "Configurações → Testar conexão" para descobrir o motivo.');
}

async function sget(key){
  if(!APPS_SCRIPT_URL) return null;
  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?action=get&key=${encodeURIComponent(key)}`);
    if(!res.ok){ console.error('get failed: HTTP', res.status); notifyFetchError(); return null; }
    const data = await res.json();
    return (data && data.value !== undefined) ? data.value : null;
  }catch(e){ console.error('get failed', e); notifyFetchError(); return null; }
}
async function sset(key, value){
  if(!APPS_SCRIPT_URL){ toast('Configure a URL do Google Sheets na aba Configurações.'); return null; }
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'set', key, value })
    });
    if(!res.ok){ console.error('set failed: HTTP', res.status); toast('Erro ao salvar (servidor respondeu com erro). Veja Configurações → Testar conexão.'); return null; }
    return await res.json();
  }catch(e){ console.error('set failed', e); toast('Erro ao salvar. Verifique sua internet e a URL configurada.'); return null; }
}
async function testConnection(){
  if(!APPS_SCRIPT_URL) return { ok:false, msg:'Nenhuma URL configurada.' };
  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?action=ping`);
    if(!res.ok) return { ok:false, msg:`O servidor respondeu com erro HTTP ${res.status}. Reimplante o Apps Script.` };
    const data = await res.json();
    return data && data.ok ? { ok:true } : { ok:false, msg:'Resposta inesperada do servidor (não veio o JSON esperado). Confira se publicou a versão mais recente do Apps Script.' };
  }catch(e){ return { ok:false, msg:'Falha ao conectar (Failed to fetch). Geralmente é: URL errada/incompleta, o app da Web não está publicado com acesso "Qualquer pessoa", ou o arquivo está sendo aberto direto do computador (file://) em vez de hospedado. Veja os passos abaixo.' }; }
}

function sanitize(s){ return String(s).trim().replace(/[\s\/\\'"]+/g,'_'); }
function pad(n){ return String(n).padStart(2,'0'); }
function localDate(d=new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function localTime(d=new Date()){ return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function fmtHM(iso){ if(!iso) return '--:--'; const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.style.opacity = '1';
  clearTimeout(toast._h); toast._h = setTimeout(()=>{ t.style.opacity = '0'; }, 2800);
}

async function getEmployees(){
  const raw = await sget('employees');
  if(!raw) return [];
  try{ return JSON.parse(raw); }catch(e){ return []; }
}
async function saveEmployees(list){ await sset('employees', JSON.stringify(list)); }

async function getRecord(date, matricula){
  const raw = await sget(`record:${date}:${matricula}`);
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}
async function saveRecord(date, matricula, rec){ await sset(`record:${date}:${matricula}`, JSON.stringify(rec)); }

async function getRodada(date, mode){
  const raw = await sget(`rodada:${date}:${mode}`);
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}
async function saveRodada(date, mode, rec){ await sset(`rodada:${date}:${mode}`, JSON.stringify(rec)); }

// ---------- cache em memória (é isso que faz "confirmar e ir para o próximo" ser instantâneo) ----------
// Sem isso, cada clique tinha que buscar de novo, na internet, o registro de TODO MUNDO antes de mostrar o próximo QR.
let employeesCache = null;
async function getEmployeesCached(){
  if(employeesCache) return employeesCache;
  employeesCache = await getEmployees();
  return employeesCache;
}
function invalidateEmployeesCache(){ employeesCache = null; }

let recordsCache = { date: null, byMat: {} };
async function ensureRecordsCache(date, employees){
  if(recordsCache.date === date) return recordsCache.byMat;
  const pairs = await Promise.all(employees.map(async emp => {
    const matricula = sanitize(emp.matricula);
    const rec = (await getRecord(date, matricula)) || { entrada: null, saida: null };
    return [matricula, rec];
  }));
  const byMat = {};
  pairs.forEach(([mat, rec]) => { byMat[mat] = rec; });
  recordsCache = { date, byMat };
  return byMat;
}
function invalidateRecordsCache(){ recordsCache = { date: null, byMat: {} }; }

// ================= APP SHELL =================
function renderAdmin(tab){
  tab = tab || (APPS_SCRIPT_URL ? 'bater-entrada' : 'config');
  app.innerHTML = `
    <div class="shell">
      <div class="topbar">
        <div class="brand">
          <div class="brand-mark">D</div>
          <h1>Controle de Ponto de Diarista<span>Checklist de entrada e saída — sincronizado via Google Sheets</span></h1>
        </div>
        <div class="tabs">
          <button class="tab-btn" data-tab="bater-entrada">Bater Entrada</button>
          <button class="tab-btn" data-tab="bater-saida">Bater Saída</button>
          <button class="tab-btn" data-tab="colaboradores">Colaboradores</button>
          <button class="tab-btn" data-tab="qrcodes">QR Codes</button>
          <button class="tab-btn" data-tab="registros">Registros</button>
          <button class="tab-btn" data-tab="backup">Backup</button>
          <button class="tab-btn" data-tab="config">Configurações</button>
        </div>
      </div>
      <div id="tabBody"><div class="empty"><span class="spinner"></span> Carregando...</div></div>
    </div>
  `;
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === tab);
    b.onclick = () => renderAdmin(b.dataset.tab);
  });
  const tabBody = $('#tabBody');
  if(!APPS_SCRIPT_URL && tab !== 'config'){
    tabBody.innerHTML = `
      <div class="card">
        <h2>Configuração necessária</h2>
        <div class="helper">Antes de usar, configure a conexão com sua planilha do Google Sheets.</div>
        <div style="margin-top:12px"><button class="btn btn-primary" id="goConfig">Ir para Configurações</button></div>
      </div>
    `;
    $('#goConfig').onclick = () => renderAdmin('config');
    return;
  }
  if(tab === 'bater-entrada') return renderPunchMode(tabBody, 'entrada');
  if(tab === 'bater-saida') return renderPunchMode(tabBody, 'saida');
  if(tab === 'colaboradores') return renderColaboradores(tabBody);
  if(tab === 'qrcodes') return renderQrCodes(tabBody);
  if(tab === 'registros') return renderRegistros(tabBody);
  if(tab === 'backup') return renderBackup(tabBody);
  if(tab === 'config') return renderConfig(tabBody);
}

async function renderConfig(el){
  el.innerHTML = `
    <div class="card">
      <h2>Conexão com o Google Sheets</h2>
      <div class="helper">Cole aqui a URL do app da Web que você publicou no Apps Script (termina em <span class="mono">/exec</span>). Precisa colar essa mesma URL em todos os aparelhos que forem usar o sistema (celular e notebook).</div>
      <div class="row" style="margin-top:12px">
        <div class="field"><label>URL do Apps Script</label><input id="scriptUrl" value="${APPS_SCRIPT_URL}" placeholder="https://script.google.com/macros/s/AKfycb.../exec"></div>
        <button class="btn btn-primary" id="saveUrlBtn">Salvar</button>
        <button class="btn btn-ghost" id="testBtn">Testar conexão</button>
      </div>
      <div class="helper" id="testResult"></div>
    </div>
  `;
  $('#saveUrlBtn').onclick = () => {
    const v = $('#scriptUrl').value.trim();
    if(!v){ toast('Cole a URL antes de salvar.'); return; }
    APPS_SCRIPT_URL = v;
    try{ localStorage.setItem('ponto_apps_script_url', v); }catch(e){}
    toast('URL salva neste aparelho.');
  };
  $('#testBtn').onclick = async () => {
    $('#testResult').innerHTML = '<span class="spinner"></span> Testando...';
    const r = await testConnection();
    $('#testResult').textContent = r.ok ? '✓ Conectado com sucesso!' : `✕ ${r.msg}`;
  };
}

// ================= BATER ENTRADA / BATER SAÍDA =================
let lastAction = 0;
const presentIndex = { entrada: 0, saida: 0 };

async function computeStates(mode){
  const isEntrada = mode === 'entrada';
  const date = localDate();
  const employees = await getEmployeesCached();
  const byMat = await ensureRecordsCache(date, employees);
  const rows = [];
  for(const emp of employees){
    const matricula = sanitize(emp.matricula);
    const rec = byMat[matricula] || { entrada: null, saida: null };
    let state, label;
    if(isEntrada){
      if(rec.entrada){ state = 'concluido'; label = `Entrada às ${fmtHM(rec.entrada)}`; }
      else { state = 'pendente'; label = null; }
    } else {
      if(rec.saida){ state = 'concluido'; label = `Saída às ${fmtHM(rec.saida)}`; }
      else if(!rec.entrada){ state = 'bloqueado'; label = 'Aguardando entrada'; }
      else { state = 'pendente'; label = null; }
    }
    rows.push({ emp, matricula, state, label });
  }
  return rows;
}

async function renderPunchMode(el, mode){
  const isEntrada = mode === 'entrada';
  const modeLabel = isEntrada ? 'Entrada' : 'Saída';

  el.innerHTML = `
    <div class="mode-banner ${mode}">
      <div>
        <div class="m-title">Modo ${modeLabel}</div>
        <div class="m-sub">${isEntrada ? 'Esta tela só registra ENTRADA. Não é possível bater saída aqui.' : 'Esta tela só registra SAÍDA. Não é possível bater entrada aqui.'}</div>
      </div>
      <div class="m-count" id="modeCount">--<span>concluídos hoje</span></div>
    </div>

    <div class="card" id="rodadaCard">
      <div class="empty"><span class="spinner"></span> Carregando...</div>
    </div>

    <div class="card">
      <h2>Ler um por um</h2>
      <div class="present-box" id="presentBox"><div class="empty"><span class="spinner"></span> Carregando...</div></div>
    </div>

    <div class="card">
      <span class="clock-mini mono" id="miniClock">--:--:--</span>
      <div class="result-banner idle" id="resultBanner">
        <div class="r-title" id="rTitle">Aguardando</div>
        <div class="r-sub" id="rSub">Ou digite a matrícula abaixo, ou toque no nome na lista</div>
      </div>
      <div class="row" style="max-width:420px;margin:0 auto">
        <div class="field"><label>Matrícula</label><input id="manualMat" placeholder="Digite a matrícula" inputmode="numeric"></div>
        <button class="btn btn-primary" id="manualBtn">Bater ${modeLabel}</button>
      </div>
    </div>

    <div class="card">
      <h2>Checklist de ${modeLabel.toLowerCase()} de hoje <span class="badge-count" id="modeCount2"></span></h2>
      <div class="field filter-input"><input id="listFilter" placeholder="Buscar por nome ou matrícula..."></div>
      <div class="check-list" id="checkList"><div class="empty"><span class="spinner"></span> Carregando...</div></div>
    </div>
  `;

  tickMiniClock();
  clearInterval(renderPunchMode._t);
  renderPunchMode._t = setInterval(tickMiniClock, 1000);

  $('#manualBtn').onclick = () => {
    const v = $('#manualMat').value.trim();
    if(!v) return;
    processPunch(v, mode);
    $('#manualMat').value = '';
  };
  $('#manualMat').onkeydown = (e) => { if(e.key === 'Enter') $('#manualBtn').click(); };
  $('#listFilter').oninput = async () => { await renderCheckList(mode); };

  await renderRodada(mode);
  await refreshMode(mode);
}

async function refreshMode(mode){
  const states = await computeStates(mode);
  await renderPresent(mode, states);
  await renderCheckList(mode, states);
}

async function renderRodada(mode){
  const modeLabel = mode === 'entrada' ? 'Entrada' : 'Saída';
  const modeLabelLower = modeLabel.toLowerCase();
  const date = localDate();
  const card = $('#rodadaCard');
  if(!card) return;

  const rodada = await getRodada(date, mode);

  if(rodada && rodada.finalizadoEm){
    card.innerHTML = `
      <h2>Rodada de ${modeLabel} de hoje</h2>
      <div class="result-banner ${mode}" style="max-width:none;margin:0 0 14px">
        <div class="r-title">✓ Rodada finalizada às ${fmtHM(rodada.finalizadoEm)}</div>
        <div class="r-sub">Você sinalizou que terminou de bater ${modeLabelLower} hoje. Isso fica salvo nos registros.</div>
      </div>
      <button class="btn btn-ghost btn-sm" id="reabrirRodada">Reabrir (ainda vou bater mais alguém)</button>
    `;
    $('#reabrirRodada').onclick = async () => {
      await saveRodada(date, mode, { finalizadoEm: null });
      await renderRodada(mode);
      toast('Rodada reaberta.');
    };
  } else {
    card.innerHTML = `
      <h2>Rodada de ${modeLabel} de hoje</h2>
      <div class="helper">Quando terminar de bater a ${modeLabelLower} de todo mundo, toque aqui para deixar registrado o horário em que essa rodada foi concluída.</div>
      <div class="row" style="margin-top:12px">
        <button class="btn present-confirm ${mode}" id="finalizarRodada" style="max-width:340px;flex:none">Terminei de bater ${modeLabelLower}</button>
      </div>
    `;
    $('#finalizarRodada').onclick = async () => {
      const iso = new Date().toISOString();
      await saveRodada(date, mode, { finalizadoEm: iso });
      await renderRodada(mode);
      toast(`Rodada de ${modeLabelLower} finalizada às ${fmtHM(iso)}.`);
    };
  }
}

async function renderPresent(mode, states){
  const isEntrada = mode === 'entrada';
  const box = $('#presentBox');
  if(!box) return;

  if(states.length === 0){
    box.innerHTML = `<div class="present-done-msg" style="color:var(--text-dim)">Nenhum colaborador cadastrado. Cadastre na aba Colaboradores.</div>`;
    return;
  }

  const pending = states.filter(s => s.state === 'pendente');
  if(pending.length === 0){
    box.innerHTML = `<div class="present-done-msg">✓ Todos já bateram ${isEntrada ? 'entrada' : 'saída'} hoje</div>`;
    return;
  }

  if(presentIndex[mode] >= pending.length) presentIndex[mode] = 0;
  if(presentIndex[mode] < 0) presentIndex[mode] = pending.length - 1;
  const current = pending[presentIndex[mode]];

  const qr = qrcode(0, 'M');
  qr.addData(current.matricula);
  qr.make();

  box.innerHTML = `
    <div class="present-progress">${presentIndex[mode] + 1} de ${pending.length} pendentes</div>
    <div class="present-qr">${qr.createSvgTag({ scalable: true })}</div>
    <div class="present-nome">${current.emp.nome}</div>
    <div class="present-mat">Matrícula ${current.emp.matricula}</div>
    <div class="present-nav">
      <button class="btn btn-ghost" id="presentPrev">◀ Anterior</button>
      <button class="btn btn-ghost" id="presentNext">Próximo ▶</button>
    </div>
    <button class="btn present-confirm ${mode}" id="presentConfirm">Confirmar ${isEntrada ? 'entrada' : 'saída'} e ir para o próximo</button>
  `;

  $('#presentPrev').onclick = () => { presentIndex[mode]--; renderPresent(mode, states); };
  $('#presentNext').onclick = () => { presentIndex[mode]++; renderPresent(mode, states); };
  $('#presentConfirm').onclick = () => processPunch(current.matricula, mode);
}

function tickMiniClock(){
  const el = $('#miniClock');
  if(el) el.textContent = localTime();
}

async function renderCheckList(mode, states){
  const isEntrada = mode === 'entrada';
  if(!states) states = await computeStates(mode);
  const filterEl = $('#listFilter');
  const filter = filterEl ? filterEl.value.trim().toLowerCase() : '';

  const employeesCount = states.length;
  const doneCount = states.filter(s => s.state === 'concluido').length;

  const filtered = states
    .filter(r => !filter || r.emp.nome.toLowerCase().includes(filter) || r.matricula.toLowerCase().includes(filter))
    .sort((a,b) => (a.state === 'pendente' ? 0 : 1) - (b.state === 'pendente' ? 0 : 1));

  const countEl = $('#modeCount');
  const countEl2 = $('#modeCount2');
  if(countEl) countEl.innerHTML = `${doneCount}/${employeesCount}<span>concluídos hoje</span>`;
  if(countEl2) countEl2.textContent = `${doneCount}/${employeesCount}`;

  const list = $('#checkList');
  if(!list) return;
  if(employeesCount === 0){
    list.innerHTML = '<div class="empty">Cadastre colaboradores na aba Colaboradores.</div>';
    return;
  }
  if(filtered.length === 0){
    list.innerHTML = '<div class="empty">Nenhum colaborador encontrado.</div>';
    return;
  }
  list.innerHTML = filtered.map(r => `
    <div class="check-row ${r.state} ${r.state === 'pendente' ? 'mode-'+mode : ''}">
      <div class="c-info">
        <div class="c-nome">${r.emp.nome}</div>
        <div class="c-mat">Mat. ${r.emp.matricula}</div>
      </div>
      ${r.state === 'pendente'
        ? `<button data-mat="${r.matricula}">Bater ${isEntrada ? 'Entrada' : 'Saída'}</button>`
        : `<div class="c-status">${r.label}</div>`}
    </div>
  `).join('');

  list.querySelectorAll('button[data-mat]').forEach(btn=>{
    btn.onclick = () => processPunch(btn.dataset.mat, mode);
  });
}

async function processPunch(raw, mode){
  const matricula = sanitize(raw);
  const now = Date.now();
  if(now - lastAction < 400) return; // guards against accidental double-tap/double-enter
  lastAction = now;

  const employees = await getEmployeesCached();
  const emp = employees.find(e => sanitize(e.matricula) === matricula);
  if(!emp){
    showResult('erro', 'Matrícula não encontrada', matricula || '(vazio)');
    return;
  }

  const date = localDate();
  const byMat = await ensureRecordsCache(date, employees);
  const rec = byMat[matricula] || { entrada: null, saida: null };

  if(mode === 'entrada'){
    if(rec.entrada){
      showResult('erro', `${emp.nome} — Entrada já registrada`, `Às ${fmtHM(rec.entrada)} · não é possível bater de novo`);
      await refreshMode(mode);
      return;
    }
    rec.entrada = new Date().toISOString();
    byMat[matricula] = rec;
    showResult('entrada', `${emp.nome} — Entrada registrada`, `Às ${fmtHM(rec.entrada)} · Matrícula ${emp.matricula}`);
    await refreshMode(mode); // instantâneo: usa o cache que acabamos de atualizar, não espera a rede
    saveRecord(date, matricula, rec); // salva na planilha em segundo plano, sem travar a tela
    return;
  }

  if(!rec.entrada){
    showResult('erro', `${emp.nome} — Sem entrada registrada hoje`, `Vá em "Bater Entrada" primeiro para este colaborador`);
    await refreshMode(mode);
    return;
  }
  if(rec.saida){
    showResult('erro', `${emp.nome} — Saída já registrada`, `Às ${fmtHM(rec.saida)} · não é possível bater de novo`);
    await refreshMode(mode);
    return;
  }
  rec.saida = new Date().toISOString();
  byMat[matricula] = rec;
  showResult('saida', `${emp.nome} — Saída registrada`, `Às ${fmtHM(rec.saida)} · Matrícula ${emp.matricula}`);
  await refreshMode(mode); // instantâneo: usa o cache que acabamos de atualizar, não espera a rede
  saveRecord(date, matricula, rec); // salva na planilha em segundo plano, sem travar a tela
}

function showResult(type, title, sub){
  const banner = $('#resultBanner');
  if(!banner) return;
  banner.className = `result-banner ${type}`;
  $('#rTitle').textContent = title;
  $('#rSub').textContent = sub;
}

// ================= COLABORADORES =================
async function renderColaboradores(el){
  const employees = await getEmployees();
  el.innerHTML = `
    <div class="card">
      <h2>Importar em massa</h2>
      <div class="helper">Cole as duas colunas da sua planilha (matrícula e nome), uma linha por colaborador. Pode colar direto do Excel — funciona com tabulação ou vírgula separando as colunas.</div>
      <div class="field" style="margin-top:10px">
        <textarea id="bulkInput" placeholder="00123	João da Silva
00124	Maria Souza
00125	Carlos Pereira"></textarea>
      </div>
      <div style="margin-top:10px"><button class="btn btn-primary" id="bulkBtn">Processar lista</button></div>
      <div class="helper" id="bulkResult"></div>
    </div>
    <div class="card">
      <h2>Adicionar um colaborador</h2>
      <div class="row">
        <div class="field"><label>Matrícula</label><input id="newMat" placeholder="Ex: 00123"></div>
        <div class="field"><label>Nome</label><input id="newNome" placeholder="Nome do colaborador"></div>
        <button class="btn btn-ghost" id="addBtn">Adicionar</button>
      </div>
    </div>
    <div class="card">
      <h2>Colaboradores cadastrados <span class="badge-count">${employees.length}</span></h2>
      ${employees.length === 0 ? '<div class="empty">Nenhum colaborador cadastrado ainda.</div>' : `
      <div class="row" style="margin-bottom:12px">
        <button class="btn btn-danger btn-sm" id="removeSelectedBtn">Remover selecionados</button>
        <button class="btn btn-danger" id="removeAllBtn">Apagar todos de uma vez</button>
      </div>
      <table>
        <thead><tr><th style="width:30px"><input type="checkbox" id="selectAllChk" title="Marcar todos"></th><th>Matrícula</th><th>Nome</th><th></th></tr></thead>
        <tbody>
          ${employees.map((e,i)=>`
            <tr>
              <td><input type="checkbox" class="rowChk" data-idx="${i}"></td>
              <td class="mono">${e.matricula}</td>
              <td>${e.nome}</td>
              <td style="text-align:right"><button class="btn btn-danger btn-sm" data-idx="${i}">Remover</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>`}
    </div>
  `;

  $('#bulkBtn').onclick = async () => {
    const raw = $('#bulkInput').value;
    const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
    let added = 0, updated = 0, ignored = 0;
    const employees = await getEmployees();
    for(const line of lines){
      let parts = line.split('\t');
      if(parts.length < 2) parts = line.split(',');
      if(parts.length < 2) parts = line.split(/\s{2,}/);
      if(parts.length < 2){ ignored++; continue; }
      const mat = parts[0].trim();
      const nome = parts.slice(1).join(' ').trim();
      if(!mat || !nome){ ignored++; continue; }
      const idx = employees.findIndex(e => sanitize(e.matricula) === sanitize(mat));
      if(idx >= 0){ employees[idx].nome = nome; updated++; }
      else { employees.push({ matricula: mat, nome }); added++; }
    }
    await saveEmployees(employees);
    invalidateEmployeesCache();
    invalidateRecordsCache();
    $('#bulkResult').textContent = `${added} adicionados, ${updated} atualizados, ${ignored} linhas ignoradas.`;
    toast('Lista processada.');
    renderAdmin('colaboradores');
  };

  $('#addBtn').onclick = async () => {
    const mat = $('#newMat').value.trim();
    const nome = $('#newNome').value.trim();
    if(!mat || !nome){ toast('Preencha matrícula e nome.'); return; }
    const employees = await getEmployees();
    if(employees.some(e => sanitize(e.matricula) === sanitize(mat))){ toast('Essa matrícula já existe.'); return; }
    employees.push({ matricula: mat, nome });
    await saveEmployees(employees);
    invalidateEmployeesCache();
    invalidateRecordsCache();
    toast('Colaborador adicionado.');
    renderAdmin('colaboradores');
  };

  const selectAllChk = $('#selectAllChk');
  if(selectAllChk){
    selectAllChk.onchange = () => {
      el.querySelectorAll('.rowChk').forEach(chk => { chk.checked = selectAllChk.checked; });
    };
  }

  const removeSelectedBtn = $('#removeSelectedBtn');
  if(removeSelectedBtn){
    removeSelectedBtn.onclick = async () => {
      const idxs = Array.from(el.querySelectorAll('.rowChk:checked')).map(chk => Number(chk.dataset.idx));
      if(idxs.length === 0){ toast('Marque ao menos um colaborador na caixinha.'); return; }
      if(!confirm(`Remover ${idxs.length} colaborador(es) selecionado(s)? Essa ação não pode ser desfeita.`)) return;
      const employees = await getEmployees();
      const remaining = employees.filter((_, i) => !idxs.includes(i));
      await saveEmployees(remaining);
      invalidateEmployeesCache();
      invalidateRecordsCache();
      toast(`${idxs.length} colaborador(es) removido(s).`);
      renderAdmin('colaboradores');
    };
  }

  const removeAllBtn = $('#removeAllBtn');
  if(removeAllBtn){
    removeAllBtn.onclick = async () => {
      const employees = await getEmployees();
      if(!confirm(`Apagar TODOS os ${employees.length} colaboradores cadastrados? Essa ação não pode ser desfeita.`)) return;
      await saveEmployees([]);
      invalidateEmployeesCache();
      invalidateRecordsCache();
      toast('Todos os colaboradores foram removidos.');
      renderAdmin('colaboradores');
    };
  }

  el.querySelectorAll('button[data-idx]').forEach(btn=>{
    btn.onclick = async () => {
      const idx = Number(btn.dataset.idx);
      const employees = await getEmployees();
      if(!confirm(`Remover ${employees[idx].nome}?`)) return;
      employees.splice(idx,1);
      await saveEmployees(employees);
      invalidateEmployeesCache();
      invalidateRecordsCache();
      toast('Colaborador removido.');
      renderAdmin('colaboradores');
    };
  });
}

// ================= QR CODES (dois conjuntos: Entrada e Saída) =================
async function renderQrCodes(el){
  const employees = await getEmployees();
  el.innerHTML = `
    <div class="card no-print">
      <h2>Sobre os QR Codes</h2>
      <div class="helper">Cada QR Code contém apenas a matrícula do colaborador, para ser lido no leitor do ponto eletrônico da empresa. Aqui embaixo tem dois conjuntos separados — um para usar na hora da entrada, outro para usar na hora da saída — assim você organiza fisicamente qual folha levar em cada horário, sem risco de pegar a errada.</div>
      <div class="row" style="margin-top:14px">
        <button class="btn btn-ghost" id="printEntrada">Imprimir só Entrada</button>
        <button class="btn btn-ghost" id="printSaida">Imprimir só Saída</button>
        <button class="btn btn-ghost" id="printAll">Imprimir os dois</button>
      </div>
    </div>
    <div id="qrContent">
      ${employees.length === 0 ? '<div class="card"><div class="empty">Cadastre colaboradores na aba Colaboradores (ou importe em massa) para gerar os QR Codes.</div></div>' : ''}
    </div>
  `;
  if(employees.length === 0) return;

  const content = $('#qrContent');
  content.innerHTML = `
    <div class="qr-section entrada">
      <h3>QR de Entrada</h3>
      <div class="qr-sub">Use este conjunto na hora de bater a entrada no ponto eletrônico.</div>
      <div class="qr-grid" id="qrGridEntrada"></div>
    </div>
    <div class="qr-section saida">
      <h3>QR de Saída</h3>
      <div class="qr-sub">Use este conjunto na hora de bater a saída no ponto eletrônico.</div>
      <div class="qr-grid" id="qrGridSaida"></div>
    </div>
  `;

  buildQrGrid($('#qrGridEntrada'), employees, 'entrada');
  buildQrGrid($('#qrGridSaida'), employees, 'saida');

  $('#printEntrada').onclick = () => { document.body.classList.add('print-only-entrada'); window.print(); setTimeout(()=>document.body.classList.remove('print-only-entrada'), 500); };
  $('#printSaida').onclick = () => { document.body.classList.add('print-only-saida'); window.print(); setTimeout(()=>document.body.classList.remove('print-only-saida'), 500); };
  $('#printAll').onclick = () => window.print();
}

function buildQrGrid(gridEl, employees, tag){
  employees.forEach(emp=>{
    const value = sanitize(emp.matricula);
    const card = document.createElement('div');
    card.className = `qr-card ${tag}`;
    const qr = qrcode(0, 'M');
    qr.addData(value);
    qr.make();
    card.innerHTML = `
      <div class="qr-box">${qr.createSvgTag({ scalable: true })}</div>
      <div class="nome">${emp.nome}</div>
      <div class="mat">Mat. ${emp.matricula}</div>
      <div class="tag">${tag === 'entrada' ? 'Entrada' : 'Saída'}</div>
    `;
    gridEl.appendChild(card);
  });
}

// ================= REGISTROS =================
async function renderRegistros(el){
  const employees = await getEmployees();
  const today = localDate();
  el.innerHTML = `
    <div class="card">
      <h2>Registros do dia</h2>
      <div class="row">
        <div class="field"><label>Data</label><input type="date" id="dateFilter" value="${today}"></div>
        <button class="btn btn-ghost" id="exportBtn">Exportar CSV</button>
      </div>
    </div>
    <div class="card"><div id="regTableWrap"><div class="empty"><span class="spinner"></span> Carregando...</div></div></div>
  `;
  const load = async () => {
    const date = $('#dateFilter').value || today;
    const wrap = $('#regTableWrap');
    const rows = await Promise.all(employees.map(async emp => {
      const rec = await getRecord(date, sanitize(emp.matricula));
      let status = 'pill-wait', statusLabel = 'Sem registro';
      if(rec && rec.entrada && rec.saida){ status='pill-done'; statusLabel='Completo'; }
      else if(rec && rec.entrada){ status='pill-open'; statusLabel='Em aberto'; }
      return { matricula: emp.matricula, nome: emp.nome, entrada: rec ? rec.entrada : null, saida: rec ? rec.saida : null, status, statusLabel };
    }));
    const rodadaEntrada = await getRodada(date, 'entrada');
    const rodadaSaida = await getRodada(date, 'saida');
    const rodadaLine = `
      <div class="helper" style="margin-bottom:14px">
        Rodada de entrada: ${rodadaEntrada && rodadaEntrada.finalizadoEm ? `<b style="color:var(--teal)">finalizada às ${fmtHM(rodadaEntrada.finalizadoEm)}</b>` : 'não finalizada'}
        &nbsp;·&nbsp;
        Rodada de saída: ${rodadaSaida && rodadaSaida.finalizadoEm ? `<b style="color:var(--amber)">finalizada às ${fmtHM(rodadaSaida.finalizadoEm)}</b>` : 'não finalizada'}
      </div>
    `;
    wrap.innerHTML = (employees.length === 0 ? '<div class="empty">Nenhum colaborador cadastrado.</div>' : rodadaLine + `
      <table>
        <thead><tr><th>Matrícula</th><th>Nome</th><th>Entrada</th><th>Saída</th><th>Status</th></tr></thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td class="mono">${r.matricula}</td>
              <td>${r.nome}</td>
              <td class="mono">${fmtHM(r.entrada)}</td>
              <td class="mono">${fmtHM(r.saida)}</td>
              <td><span class="pill ${r.status}">${r.statusLabel}</span></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `);
    $('#exportBtn').onclick = () => {
      const csv = ['Matricula,Nome,Entrada,Saida,Status', ...rows.map(r=>`${r.matricula},"${r.nome}",${fmtHM(r.entrada)},${fmtHM(r.saida)},${r.statusLabel}`)].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `ponto_${date}.csv`;
      a.click();
    };
  };
  $('#dateFilter').onchange = load;
  load();
}

// ================= BACKUP =================
async function renderBackup(el){
  el.innerHTML = `
    <div class="card">
      <h2>Exportar backup</h2>
      <div class="helper">Recomendado: baixe um backup no fim do dia como segurança extra, além dos dados sincronizados.</div>
      <div style="margin-top:12px"><button class="btn btn-primary" id="exportBackup">Baixar backup (.json)</button></div>
    </div>
  `;
  $('#exportBackup').onclick = async () => {
    const employees = await getEmployees();
    const data = { employees, date: localDate() };
    const today = localDate();
    for(const emp of employees){
      const rec = await getRecord(today, sanitize(emp.matricula));
      if(rec) data[`record:${today}:${sanitize(emp.matricula)}`] = rec;
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `ponto_backup_${today}.json`;
    a.click();
    toast('Backup baixado.');
  };
}
